<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>カスタムビンゴ | 決定版</title>
  <style>
    :root {
      --primary: #4A90E2;
      --primary-bg: #eaf4ff;
      --accent: #e74c3c;
      --bg-color: #f8fafc;
      --text-color: #334155;
      --board-size: min(92vw, 500px);
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    h1 {
      color: var(--primary);
      font-size: clamp(20px, 5vw, 28px);
      margin: 10px 0 16px;
      text-align: center;
      letter-spacing: .05em;
      text-shadow: 2px 2px 0 #fff;
    }

    /* ===== Settings ===== */
    #settings-panel {
      background: #fff;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: min(600px, 100%);
      margin-bottom: 20px;
    }

    .step-box {
      border: 2px solid var(--primary-bg);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 16px;
      background: #fff;
    }

    .step-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 12px;
      font-size: 1.1rem;
    }
    .badge {
      background: var(--primary-bg);
      color: var(--primary);
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    .grid-btns {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    button {
      font-family: inherit;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .choice-btn {
      border: 2px solid var(--primary-bg);
      background: #fff;
      color: #555;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.1s;
    }
    .choice-btn small { display:block; font-size:0.8em; color:#888; font-weight:normal; margin-top:2px; }
    .choice-btn.selected {
      border-color: var(--primary);
      background: var(--primary-bg);
      color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-bg);
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      background: #f1f5f9;
      padding: 10px;
      border-radius: 12px;
    }
    .num-ctrl-btn {
      width: 44px; height: 44px;
      border-radius: 10px;
      background: #fff;
      border: 2px solid #cbd5e1;
      font-size: 1.5rem;
      color: var(--primary);
      font-weight: 900;
    }
    .num-ctrl-btn:active { background:#e2e8f0; transform:scale(0.95); }

    input[type="number"] {
      flex: 1;
      height: 44px;
      text-align: center;
      font-size: 1.4rem;
      font-weight: bold;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      background: #fff;
      color: var(--text-color);
    }

    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 1rem;
      resize: vertical;
      margin-top: 10px;
    }

    .hint {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 8px;
      line-height: 1.4;
      font-weight: bold;
    }
    .hint.error { color: var(--accent); }
    .hint.ok { color: #27ae60; }

    #btn-start {
      width: 100%;
      background: var(--primary);
      color: #fff;
      font-size: 1.4rem;
      font-weight: 900;
      padding: 16px;
      border-radius: 50px;
      box-shadow: 0 6px 15px rgba(74,144,226, 0.4);
      margin-top: 10px;
    }
    #btn-start:active { transform: scale(0.98); }

    /* FREE checkbox disabled look */
    #check-free:disabled { opacity: 0.5; }
    .free-disabled-note { color:#94a3b8; }

    /* ===== Game ===== */
    #game-panel {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100%;
      justify-content: flex-start;
    }

    .game-header {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .mini-btn {
      padding: 8px 14px;
      font-size: 0.9rem;
      border-radius: 20px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #475569;
      font-weight: 700;
    }
    .mini-btn.active {
      background: var(--primary-bg);
      color: var(--primary);
      border-color: var(--primary);
    }
    .btn-back { background:#94a3b8; color:#fff; border:none; }

    #board-wrapper {
      width: var(--board-size);
      height: var(--board-size);
      background: #fff;
      padding: 10px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      display: grid;
      gap: 8px;
    }

    .cell {
      background: #fff;
      border: 3px solid var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(12px, 4vw, 32px);
      font-weight: 900;
      color: var(--primary);
      cursor: pointer;
      position: relative;
      transition: transform 0.1s;
      touch-action: manipulation;
    }
    #board-wrapper.grid-dense .cell { font-size: clamp(10px, 2.5vw, 20px); border-width: 2px; }

    .cell:active { transform: scale(0.92); }

    .cell.punched {
      background: #333;
      border-color: #222;
      color: rgba(255,255,255,0.2);
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.6);
    }
    .cell.punched::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.5) 100%);
    }

    .cell.free {
      border-color: var(--accent);
      background: #fff5f5;
      color: var(--accent);
      font-size: 0.8em;
    }
    .cell.free.punched {
      background: #333;
      color: rgba(255,255,255,0.1);
      border-color: #111;
    }

    .cell.bingo-line {
      animation: flash 1s infinite alternate;
      border-color: #f1c40f;
      box-shadow: 0 0 15px rgba(241, 196, 15, 0.6);
    }
    @keyframes flash { from {filter: brightness(1);} to {filter: brightness(1.2);} }

    /* Overlay */
    #overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center; justify-content: center;
      z-index: 100;
      flex-direction: column;
      padding: 16px;
    }
    .msg-card {
      background: #fff;
      padding: 26px 22px;
      border-radius: 20px;
      text-align: center;
      border: 4px solid var(--accent);
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      width: min(520px, 92vw);
    }
    @keyframes pop { from{transform:scale(0.5);} to{transform:scale(1);} }
    .msg-title { font-size: 3rem; color: var(--accent); margin: 0; font-weight: 900; }

    /* Confetti */
    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; }

  </style>
</head>
<body>

  <h1>🎉 カスタムビンゴ</h1>

  <div id="settings-panel">
    <div class="step-box">
      <div class="step-header"><span class="badge">1</span> マスの数</div>
      <div class="grid-btns" id="size-choices">
        <button type="button" class="choice-btn" data-val="3">3 × 3<small>かんたん</small></button>
        <button type="button" class="choice-btn" data-val="4">4 × 4<small>ふつう</small></button>
        <button type="button" class="choice-btn selected" data-val="5">5 × 5<small>おすすめ</small></button>
        <button type="button" class="choice-btn" data-val="6">6 × 6<small>おおい</small></button>
      </div>
    </div>

    <div class="step-box">
      <div class="step-header"><span class="badge">2</span> 数字のきめかた</div>
      <div class="grid-btns" id="mode-choices">
        <button type="button" class="choice-btn selected" data-val="range">はんい指定<small>1〜〇〇まで</small></button>
        <button type="button" class="choice-btn" data-val="custom">じぶんで<small>好きな数字・文字</small></button>
      </div>

      <div id="area-range" style="margin-top:15px;">
        <div style="font-weight:bold;">いくつまでの数字をつかう？</div>
        <div class="input-row">
          <button type="button" class="num-ctrl-btn" onclick="adjustMax(-1)">－</button>
          <input type="number" id="max-num" value="75" min="1" inputmode="numeric">
          <button type="button" class="num-ctrl-btn" onclick="adjustMax(1)">＋</button>
        </div>
        <div class="hint" id="hint-range"></div>
      </div>

      <div id="area-custom" style="display:none; margin-top:15px;">
        <div style="font-weight:bold;">つかう数字・文字を入れてね</div>
        <textarea id="custom-text" placeholder="例: 1 2 3 4 5&#10;A B C D"></textarea>
        <div class="hint" id="hint-custom"></div>
      </div>
    </div>

    <div class="step-box">
      <div class="step-header"><span class="badge">3</span> 設定</div>
      <label style="display:flex; align-items:center; cursor:pointer; font-weight:bold;">
        <input type="checkbox" id="check-free" checked style="width:20px; height:20px; margin-right:10px;">
        真ん中を「FREE」にする
      </label>
      <div class="hint" id="free-hint" style="margin-left:30px;">※5×5などのときだけ有効です</div>
    </div>

    <button id="btn-start" onclick="generateGame()">ビンゴ スタート！</button>
  </div>

  <div id="game-panel">
    <div class="game-header" id="game-header">
      <button class="mini-btn" onclick="reloadGame()">🔄 あたらしいカード</button>
      <button class="mini-btn" onclick="resetPunches()">⚡️ ぜんぶもどす</button>
      <button class="mini-btn active" id="btn-sound" onclick="toggleSound()">🔊 音: ON</button>
      <button class="mini-btn btn-back" onclick="backToSettings()">⚙️ 設定へ</button>
    </div>

    <div id="board-wrapper"></div>
  </div>

  <div id="overlay" onclick="closeOverlay()">
    <div class="msg-card" onclick="event.stopPropagation()">
      <p class="msg-title">BINGO!</p>
      <p id="overlay-sub" style="font-weight:bold; margin-top:10px;">おめでとう！そろったよ！</p>
      <button class="mini-btn" style="margin-top:20px; font-size:1.1rem; padding:10px 20px;" onclick="closeOverlay()">つづける</button>
    </div>
  </div>

  <canvas id="confetti"></canvas>

  <script>
    // === 状態管理 ===
    let state = {
      size: 5,
      mode: 'range',
      gridData: [],
      punched: [],
      bingoKey: ""
    };

    let soundEnabled = true;
    let audioCtx = null;

    // confetti
    let confettiReq = null;
    let confettiTimer = null;

    window.addEventListener('resize', () => {
      fitBoardSize();
      resizeConfetti();
    }, { passive:true });

    // UI: サイズ選択
    document.querySelectorAll('#size-choices .choice-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#size-choices .choice-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        state.size = parseInt(btn.dataset.val, 10);
        normalizeFreeOption();
        validateInputs();
      });
    });

    // UI: モード選択
    document.querySelectorAll('#mode-choices .choice-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#mode-choices .choice-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        state.mode = btn.dataset.val;
        document.getElementById('area-range').style.display = (state.mode === 'range') ? 'block' : 'none';
        document.getElementById('area-custom').style.display = (state.mode === 'custom') ? 'block' : 'none';
        normalizeFreeOption();
        validateInputs();
      });
    });

    document.getElementById('max-num').addEventListener('input', validateInputs);
    document.getElementById('custom-text').addEventListener('input', validateInputs);
    document.getElementById('check-free').addEventListener('change', validateInputs);

    // 偶数サイズのとき FREE を無効化して混乱を防ぐ
    function normalizeFreeOption(){
      const cb = document.getElementById('check-free');
      const hint = document.getElementById('free-hint');
      const isOdd = state.size % 2 !== 0;

      if(!isOdd){
        cb.checked = false;
        cb.disabled = true;
        hint.textContent = "※偶数（4×4/6×6）は FREE なしです";
        hint.classList.add("free-disabled-note");
      }else{
        cb.disabled = false;
        hint.textContent = "※5×5などのときだけ有効です";
        hint.classList.remove("free-disabled-note");
      }
    }

    function getNeededCount() {
      const useFree = document.getElementById('check-free').checked;
      const isOdd = state.size % 2 !== 0;
      return (state.size * state.size) - (useFree && isOdd ? 1 : 0);
    }

    function parseCustomList(txt){
      return txt.replace(/，/g, ',').split(/[\s,]+/).map(s=>s.trim()).filter(Boolean);
    }

    function validateInputs() {
      normalizeFreeOption();
      const needed = getNeededCount();

      if (state.mode === 'range') {
        const max = parseInt(document.getElementById('max-num').value, 10) || 0;
        const hint = document.getElementById('hint-range');
        if (max < needed) {
          hint.textContent = `たりないよ！あと ${needed - max} ほしいな (必要: ${needed})`;
          hint.className = 'hint error';
        } else {
          hint.textContent = `OK！準備バッチリだよ (必要: ${needed})`;
          hint.className = 'hint ok';
        }
      } else {
        const list = parseCustomList(document.getElementById('custom-text').value);
        const hint = document.getElementById('hint-custom');
        if (list.length < needed) {
          hint.textContent = `たりないよ！あと ${needed - list.length} 個いれてね (必要: ${needed})`;
          hint.className = 'hint error';
        } else {
          hint.textContent = `OK！ (${list.length}個 入ってるよ)`;
          hint.className = 'hint ok';
        }
      }
    }

    function adjustMax(delta) {
      const input = document.getElementById('max-num');
      let val = parseInt(input.value, 10) || 0;
      val = Math.max(1, val + delta);
      input.value = val;
      validateInputs();
    }

    // ゲーム生成
    function generateGame() {
      normalizeFreeOption();

      const needed = getNeededCount();
      let source = [];

      if (state.mode === 'range') {
        const max = parseInt(document.getElementById('max-num').value, 10);
        if (max < needed) { alert('数字が足りません'); return; }
        for (let i = 1; i <= max; i++) source.push(i);
      } else {
        source = parseCustomList(document.getElementById('custom-text').value);
        if (source.length < needed) { alert('文字が足りません'); return; }
      }

      // シャッフル
      for (let i = source.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [source[i], source[j]] = [source[j], source[i]];
      }

      state.gridData = [];
      state.punched = [];
      state.bingoKey = "";

      const total = state.size * state.size;
      const center = Math.floor(total / 2);
      const isOdd = state.size % 2 !== 0;
      const useFree = document.getElementById('check-free').checked;

      let idx = 0;
      for (let i = 0; i < total; i++) {
        if (useFree && isOdd && i === center) {
          state.gridData.push('FREE');
          state.punched.push(true);
        } else {
          state.gridData.push(source[idx]);
          state.punched.push(false);
          idx++;
        }
      }

      document.getElementById('settings-panel').style.display = 'none';
      document.getElementById('game-panel').style.display = 'flex';

      renderBoard();
      fitBoardSize();
      resizeConfetti();
      initAudio();
    }

    function renderBoard() {
      const wrapper = document.getElementById('board-wrapper');
      wrapper.innerHTML = '';

      wrapper.style.gridTemplateColumns = `repeat(${state.size}, 1fr)`;
      wrapper.classList.toggle('grid-dense', state.size >= 6);

      state.gridData.forEach((val, i) => {
        const div = document.createElement('div');
        div.className = 'cell';
        if (val === 'FREE') div.classList.add('free');
        if (state.punched[i]) div.classList.add('punched');

        div.textContent = val;
        div.onclick = () => toggleCell(i);
        wrapper.appendChild(div);
      });

      checkBingo(false);
    }

    function toggleCell(index) {
      if (state.gridData[index] === 'FREE') return;

      state.punched[index] = !state.punched[index];

      const cells = document.querySelectorAll('.cell');
      if (state.punched[index]) {
        cells[index].classList.add('punched');
        playSound('punch');
      } else {
        cells[index].classList.remove('punched');
        playSound('cancel');
      }

      checkBingo(true);
    }

    function makeBingoKey(lines){
      // 同じ内容なら同じキーに（順番の影響を受けにくくする）
      const k = lines.map(l => `${l.type}:${l.idx}`).sort().join('|');
      return `${lines.length}|${k}`;
    }

    function checkBingo(withEffect) {
      const s = state.size;
      const p = state.punched;
      let lines = [];

      // rows
      for (let y = 0; y < s; y++) {
        let ok = true;
        for (let x = 0; x < s; x++) if (!p[y * s + x]) ok = false;
        if (ok) lines.push({ type: 'row', idx: y });
      }
      // cols
      for (let x = 0; x < s; x++) {
        let ok = true;
        for (let y = 0; y < s; y++) if (!p[y * s + x]) ok = false;
        if (ok) lines.push({ type: 'col', idx: x });
      }
      // diags
      let d1 = true, d2 = true;
      for (let i = 0; i < s; i++) {
        if (!p[i * s + i]) d1 = false;
        if (!p[i * s + (s - 1 - i)]) d2 = false;
      }
      if (d1) lines.push({ type: 'diag', idx: 0 });
      if (d2) lines.push({ type: 'diag', idx: 1 });

      const cells = document.querySelectorAll('.cell');
      cells.forEach(c => c.classList.remove('bingo-line'));

      lines.forEach(line => {
        if (line.type === 'row') for (let k = 0; k < s; k++) cells[line.idx * s + k].classList.add('bingo-line');
        if (line.type === 'col') for (let k = 0; k < s; k++) cells[k * s + line.idx].classList.add('bingo-line');
        if (line.type === 'diag') {
          if (line.idx === 0) for (let k = 0; k < s; k++) cells[k * s + k].classList.add('bingo-line');
          if (line.idx === 1) for (let k = 0; k < s; k++) cells[k * s + (s - 1 - k)].classList.add('bingo-line');
        }
      });

      // ★重要：ビンゴが消えたらキーをリセット（これで再ビンゴ演出が生きる）
      if (lines.length === 0) {
        state.bingoKey = "";
        return;
      }

      const currentKey = makeBingoKey(lines);

      if (withEffect && currentKey !== state.bingoKey) {
        state.bingoKey = currentKey;

        const sub = document.getElementById('overlay-sub');
        sub.textContent = (lines.length >= 2) ? `すごい！ ${lines.length}ライン！` : `おめでとう！そろったよ！`;

        playSound('bingo');
        showOverlay();
        startConfetti(2200);
      }
    }

    // ===== utilities =====
    function fitBoardSize() {
      const panel = document.getElementById('game-panel');
      if (panel.style.display === 'none') return;

      const h1 = document.querySelector('h1').offsetHeight;
      const header = document.getElementById('game-header').offsetHeight;
      const winH = window.innerHeight;
      const winW = window.innerWidth;

      const availableH = winH - h1 - header - 40;
      const availableW = winW - 32;

      const size = Math.max(240, Math.min(availableH, availableW, 600));
      document.documentElement.style.setProperty('--board-size', size + 'px');
    }

    function reloadGame() {
      if (confirm('同じ設定で新しいカードを作りますか？')) generateGame();
    }

    function resetPunches() {
      if (confirm('穴をすべて戻しますか？')) {
        state.punched = state.punched.map((v, i) => (state.gridData[i] === 'FREE'));
        state.bingoKey = "";
        renderBoard();
        closeOverlay();
        stopConfetti();
      }
    }

    function backToSettings() {
      document.getElementById('game-panel').style.display = 'none';
      document.getElementById('settings-panel').style.display = 'block';
      closeOverlay();
      stopConfetti();
      validateInputs();
    }

    // ===== audio =====
    function initAudio() {
      if (soundEnabled && !audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('btn-sound');
      btn.textContent = soundEnabled ? '🔊 音: ON' : '🔇 音: OFF';
      btn.classList.toggle('active', soundEnabled);
      if (soundEnabled) initAudio();
    }

    function playSound(type) {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const t = audioCtx.currentTime;

      if (type === 'punch') {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'triangle';
        o.frequency.setValueAtTime(600, t);
        o.frequency.exponentialRampToValueAtTime(110, t + 0.10);
        g.gain.setValueAtTime(0.45, t);
        g.gain.linearRampToValueAtTime(0, t + 0.10);
        o.start(t); o.stop(t + 0.11);
      } else if (type === 'cancel') {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(200, t);
        o.frequency.linearRampToValueAtTime(420, t + 0.10);
        g.gain.setValueAtTime(0.28, t);
        g.gain.linearRampToValueAtTime(0, t + 0.10);
        o.start(t); o.stop(t + 0.11);
      } else if (type === 'bingo') {
        const freqs = [523, 659, 784, 1046];
        freqs.forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gn = audioCtx.createGain();
          osc.connect(gn); gn.connect(audioCtx.destination);
          osc.type = 'triangle';
          osc.frequency.value = f;
          const tt = t + i * 0.09;
          gn.gain.setValueAtTime(0, tt);
          gn.gain.linearRampToValueAtTime(0.2, tt + 0.05);
          gn.gain.exponentialRampToValueAtTime(0.01, tt + 0.45);
          osc.start(tt);
          osc.stop(tt + 0.55);
        });
      }
    }

    // ===== overlay =====
    function showOverlay() {
      document.getElementById('overlay').style.display = 'flex';
    }
    function closeOverlay() {
      document.getElementById('overlay').style.display = 'none';
    }

    // ===== confetti (DPR + auto stop) =====
    function resizeConfetti(){
      const cvs = document.getElementById('confetti');
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      cvs.width = Math.floor(window.innerWidth * dpr);
      cvs.height = Math.floor(window.innerHeight * dpr);
      cvs.style.width = window.innerWidth + 'px';
      cvs.style.height = window.innerHeight + 'px';
      const ctx = cvs.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function startConfetti(ms = 2200) {
      stopConfetti();
      resizeConfetti();

      const cvs = document.getElementById('confetti');
      const ctx = cvs.getContext('2d');
      const w = window.innerWidth;
      const h = window.innerHeight;
      const colors = ['#ff4d4d', '#2EC4B6', '#4A90E2', '#ffd166', '#9b5de5', '#06d6a0'];

      const N = Math.min(180, Math.max(110, Math.floor(w / 6)));
      const particles = Array.from({ length: N }, () => ({
        x: Math.random() * w,
        y: -20 - Math.random() * h * 0.6,
        vx: Math.random() * 4 - 2,
        vy: Math.random() * 5 + 2,
        c: colors[Math.floor(Math.random() * colors.length)],
        s: Math.random() * 9 + 4,
        r: Math.random() * Math.PI,
        vr: Math.random() * 0.25 - 0.125,
      }));

      const start = performance.now();

      function loop(now) {
        const elapsed = now - start;
        ctx.clearRect(0, 0, w, h);

        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.r += p.vr;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.r);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s);
          ctx.restore();

          if (p.y > h + 40) {
            p.y = -20;
            p.x = Math.random() * w;
          }
          if (p.x < -20) p.x = w + 20;
          if (p.x > w + 20) p.x = -20;
        }

        if (elapsed < ms) {
          confettiReq = requestAnimationFrame(loop);
        } else {
          stopConfetti();
        }
      }

      confettiReq = requestAnimationFrame(loop);
      confettiTimer = setTimeout(stopConfetti, ms + 100);
    }

    function stopConfetti(){
      if(confettiReq) cancelAnimationFrame(confettiReq);
      confettiReq = null;
      if(confettiTimer) clearTimeout(confettiTimer);
      confettiTimer = null;

      const cvs = document.getElementById('confetti');
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0, 0, cvs.width, cvs.height);
    }

    // 初期化
    normalizeFreeOption();
    validateInputs();
    resizeConfetti();
  </script>
